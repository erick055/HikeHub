 <style>
    * {

    header {
      background: #2e8b57;
      color: white;

      padding: 15px 30px;
    }

    header h1 {

    }

    header nav a {
      color: white;

      font-weight: bold;
    }

    .hero {
      position: relative;
      text-align: center;
      color: white;
    }

    .hero img {
      width: 100%;
      height: 700px;
      object-fit: cover;
      filter: brightness(70%);
    }

    .hero-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .hero-text h2 {
      font-size: 36px;
      font-weight: bold;
    }

    .hero-text p {
      margin: 15px 0;
      font-size: 16px;
    }

    .hero-text button {
      padding: 10px 20px;
      background: black;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .gallery-section {
      text-align: center;
      padding: 40px 20px;
    }

    .gallery-section h3 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #2e8b57;
    }

    .gallery-section p {
      margin-bottom: 30px;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .difficulty {
      display: inline-block;
      margin: 10px;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    .easy {
